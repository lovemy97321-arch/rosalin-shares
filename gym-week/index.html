<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جاري فتح التطبيق...</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fff5f8;
      color: #3d2832;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      max-width: 420px;
      box-shadow: 0 8px 28px rgba(92, 61, 74, 0.12);
    }
    .app-logo {
      display: block;
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(92, 61, 74, 0.16);
    }
    a.btn {
      display: inline-block;
      margin-top: 16px;
      background: #e83e8c;
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 14px;
      font-weight: 700;
    }
    .store-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
    }
    .store-btn {
      display: block;
      line-height: 0;
      text-decoration: none;
    }
    .app-store-badge {
      display: block;
      width: 180px;
      max-width: 100%;
      height: auto;
    }
    .muted { color: #8a6a75; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="app-logo" src="rosalin-icon.jpg" alt="شعار روزالين" width="60" height="60" />
    <h1 style="font-size:22px;margin:0 0 8px">روزالين</h1>
    <p id="status">جاري فتح التطبيق…</p>
    <p class="muted" id="hint">
      إذا لم يفتح التطبيق أو لم يكن مثبتاً، اختاري متجر جهازك:
    </p>
    <a class="btn" id="open-app-btn" href="#">جاري فتح التطبيق... إذا لم يفتح تلقائياً اضغط هنا</a>
    <div class="store-options" id="store-options" hidden>
      <a class="store-btn" id="ios-store-link" href="https://apps.apple.com/app/id6808414346" hidden>
        <img class="app-store-badge" src="app-store-badge.svg" alt="Download on the App Store" width="180" height="60" />
      </a>
      <p class="muted" id="android-store-pending" hidden>
        نسخة Android قيد المراجعة على Google Play وستتوفر قريباً.
      </p>
    </div>
  </div>
  <script>
    function showStoreFallback() {
      const userAgent = navigator.userAgent || '';
      const isIOS = /iPhone|iPad|iPod/i.test(userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isAndroid = /Android/i.test(userAgent);
      const options = document.getElementById('store-options');
      const storeLink = document.getElementById('ios-store-link');

      options.hidden = false;
      storeLink.href = isIOS
        ? 'itms-apps://apps.apple.com/app/id6808414346'
        : 'https://apps.apple.com/app/id6808414346';
      storeLink.hidden = isAndroid;
      document.getElementById('android-store-pending').hidden = isIOS;
    }

    function redirectToApp() {
      const currentSearch = window.location.search;
      const appScheme = 'rosalin://gym-week' + currentSearch;
      document.getElementById('open-app-btn').href = appScheme;
      showStoreFallback();
      window.location.href = appScheme;
    }

    window.onload = redirectToApp;
  </script>
</body>
</html>
