<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="حمّلي تطبيق روزالين لتنظيم صحتك ولياقتك. | Download the Rosalin app for your health &amp; fitness." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="روزالين" />
  <meta property="og:title" content="تحميل روزالين | Download Rosalin" />
  <meta property="og:description" content="حمّلي تطبيق روزالين لتنظيم صحتك ولياقتك. | Download the Rosalin app for your health &amp; fitness." />
  <meta property="og:url" content="https://rosalin.app/rosalin-shares/download/" />
  <meta property="og:image" content="https://rosalin.app/rosalin-shares/download/og-image-v2.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />

  <meta name="twitter:image" content="https://rosalin.app/rosalin-shares/download/og-image-v2.jpg" />
  <title>تحميل روزالين</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fff5f8;
      color: #3d2832;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 28px rgba(92, 61, 74, 0.12);
    }
    .app-logo {
      display: block;
      width: 60px;
      height: 60px;
      margin: 0 auto 12px;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 4px 12px rgba(92, 61, 74, 0.16);
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { line-height: 1.7; }
    .muted { color: #8a6a75; font-size: 14px; margin-top: 12px; }
    .store-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }
    .store-btn {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 210px;
      min-height: 58px;
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    .google-play { background: #202124; }
    .app-store { background: #e83e8c; }
    .store-btn:focus-visible { outline: 3px solid #3d2832; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="app-logo" src="../gym-week/rosalin-icon.jpg" alt="شعار روزالين" data-i18n-alt="logo" width="60" height="60" />
    <h1 data-i18n="title">حمّلي تطبيق روزالين</h1>
    <p id="status" aria-live="polite" data-i18n="redirecting">نحوّلك إلى متجر جهازك…</p>
    <p class="muted" data-i18n="fallback">إذا لم يبدأ التحويل تلقائياً، اختاري متجرك:</p>
    <nav class="store-options" aria-label="متاجر التطبيقات" data-i18n-aria="stores">
      <a class="store-btn google-play" href="https://play.google.com/store/apps/details?id=com.rosalin" rel="noopener" data-i18n="gp">تحميل من Google Play</a>
      <a class="store-btn app-store" href="https://apps.apple.com/app/id6808414346" rel="noopener" data-i18n="as">تحميل من App Store</a>
    </nav>
  </main>
  <script>
    (() => {
      const strings = {
        ar: {
          title: 'حمّلي تطبيق روزالين', redirecting: 'نحوّلك إلى متجر جهازك…',
          fallback: 'إذا لم يبدأ التحويل تلقائياً، اختاري متجرك:',
          gp: 'تحميل من Google Play', as: 'تحميل من App Store',
          choose: 'اختاري المتجر المناسب لجهازك لتنزيل التطبيق.',
          manual: 'لم يبدأ التحويل تلقائياً، اضغطي على زر المتجر أدناه.',
          stores: 'متاجر التطبيقات', logo: 'شعار روزالين',
          pageTitle: 'تحميل روزالين'
        },
        en: {
          title: 'Download the Rosalin app', redirecting: 'Redirecting you to your device\u2019s store\u2026',
          fallback: 'If you are not redirected automatically, choose your store:',
          gp: 'Get it on Google Play', as: 'Download on the App Store',
          choose: 'Choose the right store for your device to download the app.',
          manual: 'Automatic redirect did not start. Tap a store button below.',
          stores: 'App stores', logo: 'Rosalin logo',
          pageTitle: 'Download Rosalin'
        }
      };
      const languages = (navigator.languages && navigator.languages.length)
        ? navigator.languages : [navigator.language || 'ar'];
      const lang = /^ar/i.test(String(languages[0])) ? 'ar' : 'en';
      const t = strings[lang];
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
        document.title = t.pageTitle;
        document.body.style.textAlign = 'center';
      }
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t[el.dataset.i18nAria]));
      document.querySelectorAll('[data-i18n-alt]').forEach((el) => el.setAttribute('alt', t[el.dataset.i18nAlt]));
      const userAgent = navigator.userAgent || '';
      const uaData = navigator.userAgentData || {};
      const platform = String(uaData.platform || navigator.platform || '');
      const touch = navigator.maxTouchPoints > 1;
      const isIOS = /iPhone|iPad|iPod|iOS/i.test(userAgent) || /iPhone|iPad|iPod|iOS/i.test(platform) ||
        (navigator.platform === 'MacIntel' && touch);
      const isAndroid = !isIOS && (
        /Android|Adr|Silk|Mobile Safari|; wv\)/i.test(userAgent) ||
        /Android/i.test(platform) ||
        (touch && (/armv|aarch/i.test(platform) || (/Linux/i.test(platform) && !/X11/i.test(userAgent))))
      );
      const storeUrl = isAndroid
        ? 'https://play.google.com/store/apps/details?id=com.rosalin'
        : isIOS
          ? 'https://apps.apple.com/app/id6808414346'
          : null;

      const report = (store) => {
        try {
          fetch('https://rosalin-gym-invites.lovemy97321.workers.dev/api/store-events', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ store }),
            keepalive: true
          }).catch(() => {});
        } catch (_) {}
      };
      const storeOf = (url) => url.indexOf('play.google.com') !== -1 ? 'google-play' : 'app-store';
      document.addEventListener('click', (event) => {
        const link = event.target.closest && event.target.closest('a[href]');
        if (link && /play\.google\.com|apps\.apple\.com/.test(link.href)) report(storeOf(link.href));
      });

      if (storeUrl) {
        report(storeOf(storeUrl));
        window.setTimeout(() => {
          try { window.location.replace(storeUrl); } catch (_) { window.location.href = storeUrl; }
        }, 900);
        window.setTimeout(() => {
          if (document.visibilityState === 'visible') {
            document.getElementById('status').textContent =
              t.manual;
          }
        }, 3000);
      } else {
        document.getElementById('status').textContent =
          t.choose;
      }
    })();
  </script>
</body>
</html>
